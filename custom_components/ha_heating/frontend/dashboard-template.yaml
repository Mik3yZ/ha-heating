# HA Heating - Universeel Lovelace Dashboard Template
#
# 💡 TIP VOOR AUTOMATISCHE GENERATIE:
# HA Heating kan dit dashboard 100% automatisch genereren op basis van jouw kamers en sensoren!
# 1. Ga naar Ontwikkelaarshulpmiddelen > Acties (Developer Tools > Services).
# 2. Voer actie uit: 'HA Heating: Genereer Dashboard' (ha_heating.generate_dashboard).
# 3. Het dashboard wordt direct opgeslagen in '/config/ha_heating_dashboard.yaml' en als notificatie getoond!
#
# Of pas de onderstaande configuratie handmatig aan met jouw entiteiten:

title: Slimme Verwarming & Koeling
icon: mdi:home-thermometer
views:
  - title: Kamers & Zones
    path: kamers
    icon: mdi:radiator
    cards:
      # Systeem Notificatie / Statusbalk
      - type: horizontal-stack
        cards:
          - type: entity
            entity: sensor.ha_heating_central_hub_actieve_week
            name: Actieve Cyclus
            icon: mdi:calendar-sync
          - type: entity
            entity: sensor.ha_heating_central_hub_arbitrage_advies
            name: Advies Verwarmen
            icon: mdi:scale-balance
          - type: entity
            entity: sensor.ha_heating_central_hub_airco_cop
            name: Airco COP
            icon: mdi:heat-pump-outline

      # Optie A: Gebruik de ingebouwde HA Thermostaatkaart (Werkt altijd direct)
      # Vervang 'climate.jouw_kamer' door de werkelijke klimaatentiteit van je kamer:
      - type: vertical-stack
        cards:
          - type: thermostat
            entity: climate.woonkamer
            name: 🛋️ Woonkamer
            features:
              - type: climate-preset-modes
                style: icons
                preset_modes:
                  - comfort
                  - eco
                  - sleep
                  - away
                  - boost

      # Optie B: Gebruik de interactieve HA Heating maatwerk kaart
      # (Werkt automatisch met tabbladen als je 'entity' leeg laat, of geef je kamer op)
      - type: custom:ha-heating-card
        name: 🌡️ Kamers Overzicht

  - title: Energie & Arbitrage
    path: energie
    icon: mdi:lightning-bolt
    cards:
      - type: vertical-stack
        cards:
          # Actuele Energietarieven (Pas aan naar jouw energie-sensoren)
          - type: glance
            title: Actuele Energietarieven
            entities:
              - entity: sensor.ha_heating_central_hub_thermische_kosten_gas
                name: Gas Thermisch (€/kWh)
                icon: mdi:fire
              - entity: sensor.ha_heating_central_hub_thermische_kosten_airco
                name: Airco Thermisch (€/kWh)
                icon: mdi:lightning-bolt
              - entity: sensor.ha_heating_central_hub_airco_cop
                name: Actuele Airco COP
                icon: mdi:heat-pump-outline

          # Meters: Thermische kosten vergelijking
          - type: horizontal-stack
            cards:
              - type: gauge
                entity: sensor.ha_heating_central_hub_thermische_kosten_gas
                name: Kosten Gas per kWh Warmte
                unit: "€/kWh"
                min: 0.05
                max: 0.35
                needle: true
                severity:
                  green: 0.05
                  yellow: 0.15
                  red: 0.25
              - type: gauge
                entity: sensor.ha_heating_central_hub_thermische_kosten_airco
                name: Kosten Airco per kWh Warmte
                unit: "€/kWh"
                min: 0.02
                max: 0.35
                needle: true
                severity:
                  green: 0.02
                  yellow: 0.12
                  red: 0.22

          # Toelichting op de werking van dynamische arbitrage
          - type: markdown
            title: Slimme Arbitrage Berekening
            content: >
              De integratie berekent continu welke warmtebron financieel het voordeligst is:

              - **Gasverwarming (CV-ketel)**: `Gasprijs / 9.0 kWh/m³` (rendement HR-ketel verwerkt).
              - **Airconditioner (Warmtepomp)**: `Stroomprijs / COP(buitentemperatuur)`.

              Wanneer er **zonne-energie overschot** is of stroomprijzen negatief zijn, krijgt de airco altijd automatisch voorrang.
